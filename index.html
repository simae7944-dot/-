<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>트친님 드새요</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&family=Jua&family=Orbitron:wght@400;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
/* ---------- Y2K (기본) ---------- */
:root,[data-theme="y2k"]{
 --bg:#b9c9ff;--dots:radial-gradient(#fff 2px,transparent 2.5px);--dsz:20px;
 --ink:#3b2a73;--sub:#7d6bb5;--win:#fdf2ff;--line:#5a4bd1;--shadow:5px 5px 0 #5a4bd1;
 --bar:linear-gradient(#fff 0,#ffc2ec 45%,#ff6fcf 55%,#ff9be0 100%);--bartx:#5b1a63;
 --btn:linear-gradient(#fff 0,#d6f3ff 48%,#8fd0ff 52%,#c9ecff 100%);--btnb:#4b6fd6;--btnr:999px;
 --acc:#ff3fb4;--font:"Jua","Trebuchet MS","Malgun Gothic",sans-serif;--hfont:"Black Han Sans","Jua",sans-serif;--r:6px;--hd:"★ ";--tail:" ★"}
[data-theme="vocaloid"]{
 --bg:#061216;--dots:repeating-linear-gradient(0deg,#0000 0 2px,#39c5bb14 2px 3px);--dsz:auto;
 --ink:#d9fffb;--sub:#6fb5ae;--win:#0b1d22;--line:#39c5bb;--shadow:5px 5px 0 #e0218a;
 --bar:#39c5bb;--bartx:#04201e;
 --btn:#0b1d22;--btnb:#39c5bb;--btnr:0;
 --acc:#ff3aa3;--font:"Gothic A1","Malgun Gothic",sans-serif;--hfont:"Orbitron","Gothic A1",sans-serif;--r:0;--hd:"♪ ";--tail:" ♪"}
[data-theme="normal"]{
 --bg:#f4f3ef;--dots:none;--dsz:auto;
 --ink:#1c1c1c;--sub:#777;--win:#fff;--line:#1c1c1c;--shadow:none;
 --bar:#fff;--bartx:#1c1c1c;
 --btn:#fff;--btnb:#1c1c1c;--btnr:3px;
 --acc:#1c1c1c;--font:"IBM Plex Sans KR",system-ui,sans-serif;--hfont:"IBM Plex Sans KR",system-ui,sans-serif;--r:3px;--hd:"";--tail:""}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:var(--dots);background-size:var(--dsz);color:var(--ink);font-family:var(--font);font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.mq{overflow:hidden;white-space:nowrap;border:2px solid var(--line);background:var(--win);color:var(--acc);font-weight:700;margin-bottom:12px;font-size:13px}
.mq span{display:inline-block;padding-left:100%;animation:m 16s linear infinite}
@keyframes m{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.mq span{animation:none;padding-left:8px}}
[data-theme="normal"] .mq{display:none}
h1{font-family:var(--hfont);font-weight:400;margin:6px 0 2px;font-size:2.1rem;line-height:1.1;letter-spacing:-.02em;color:var(--acc);text-align:center}
h1::before{content:var(--hd)}h1::after{content:var(--tail)}
[data-theme="y2k"] h1{-webkit-text-stroke:1px #fff;text-shadow:3px 3px 0 #fff,5px 5px 0 #b7a6ff}
[data-theme="vocaloid"] h1{font-weight:900;text-shadow:2px 0 #39c5bb,-2px 0 #e0218a}
[data-theme="normal"] h1{font-weight:700;text-align:left;font-size:1.6rem}
.sub{text-align:center;color:var(--sub);margin:0 0 12px;font-size:13px}
[data-theme="normal"] .sub{text-align:left}
.win{border:2px solid var(--line);background:var(--win);box-shadow:var(--shadow);margin-bottom:16px;border-radius:var(--r)}
.bar{background:var(--bar);color:var(--bartx);padding:4px 8px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line)}
.bar i{font-style:normal;letter-spacing:3px;font-size:12px}
[data-theme="normal"] .bar i{display:none}
.body{padding:12px}
button,input{font:inherit;color:var(--ink)}
button{background:var(--btn);border:2px solid var(--btnb);border-radius:var(--btnr);padding:5px 14px;cursor:pointer;font-weight:700}
button:active{transform:translate(2px,2px)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
[data-theme="y2k"] button.on{background:linear-gradient(#ffd3f1,#ff3fb4);border-color:#a3156f}
input{width:100%;background:transparent;border:0;border-bottom:2px dotted var(--line);padding:6px 2px;outline:0}
input::placeholder{color:var(--sub)}
.themes{display:flex;gap:6px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap}
.row{display:flex;gap:10px}
#drop{border:2px dashed var(--line);padding:16px 10px;text-align:center;color:var(--sub)}
#drop.hot{background:var(--acc);color:#fff}
.add{display:flex;gap:8px;margin-top:10px}
.item{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px dotted var(--line);cursor:pointer}
.item.cur{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.n{width:26px;text-align:center;color:var(--acc);font-weight:700}
.x,.go{padding:1px 8px;font-size:13px;text-decoration:none;color:var(--ink);border:2px solid var(--btnb);border-radius:var(--btnr);background:var(--btn);font-weight:700}
.player{aspect-ratio:16/9;width:100%;border:2px solid var(--line);background:#000}
.big{display:block;text-align:center;margin-top:10px;padding:8px;text-decoration:none;color:var(--ink);border:2px solid var(--btnb);border-radius:var(--btnr);background:var(--btn);font-weight:700}
.empty{color:var(--sub);text-align:center;padding:8px}
small{color:var(--sub)}
</style>
</head>
<body>
<main>
  <div class="mq"><span>★ 트친님 드새요 ★ 오늘의 플리 도착 ★ 트친님 드새요 ★ 오늘의 플리 도착 ★</span></div>
  <p class="sub" id="msg" hidden style="color:var(--acc);font-weight:700"></p>
  <h1>트친님 드새요</h1>
  <p class="sub">드래그 한 번으로 만드는 노래 추천 플리</p>
  <div class="themes" id="themes"></div>

  <div class="win"><div class="bar"><span>info.txt</span><i>_ □ ×</i></div><div class="body">
    <input id="title" placeholder="플리 이름 (예: 비 오는 날 듣는 노래)">
    <div class="row"><input id="to" placeholder="받는 사람"><input id="from" placeholder="보내는 사람"></div>
  </div></div>

  <div class="win"><div class="bar"><span>링크 넣기</span><i>_ □ ×</i></div><div class="body">
    <div id="drop">유튜브 링크를 여기에 끌어다 놓기
      <div class="add"><input id="url" placeholder="또는 링크 붙여넣기"><button id="addBtn">추가</button></div>
    </div>
  </div></div>

  <div class="win"><div class="bar"><span>playlist</span><i>_ □ ×</i></div><div class="body" id="pl"></div></div>

  <div class="win" id="pcard" hidden><div class="bar"><span>now playing</span><i>_ □ ×</i></div><div class="body">
    <iframe class="player" id="player" referrerpolicy="strict-origin-when-cross-origin" title="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <a class="big" id="ext" target="_blank" rel="noopener">▶ 유튜브에서 재생하기</a>
  </div></div>

  <div class="win"><div class="bar"><span>보내기</span><i>_ □ ×</i></div><div class="body">
    <button id="share">공유 링크 만들기</button>
    <input id="out" readonly placeholder="여기에 링크가 생겨요" style="margin-top:8px">
    <small>플리가 링크 안에 들어가요. 받은 사람이 열면 똑같이 보여요.</small>
  </div></div>
</main>
<script>
var S={title:"",to:"",from:"",theme:"y2k",songs:[]},cur=-1;
var TH=[["y2k","Y2K"],["vocaloid","보컬로이드"],["normal","노멀"]];
var $=function(i){return document.getElementById(i)};
function vid(t){var m=(t||"").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:null}
var fail=false;
function b64u(b){var t="";for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(t){t=t.replace(/-/g,"+").replace(/_/g,"/").replace(/ /g,"+");while(t.length%4)t+="=";var r=atob(t),b=new Uint8Array(r.length);for(var i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return b}
async function pack(o){var raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{var st=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "z"+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}catch(e){}}
  return "r"+b64u(raw)}
async function unpack(t){var k=t.charAt(0);
  if(k!=="z"&&k!=="r"){return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(t)))))}
  var b=unb64u(t.slice(1));
  if(k==="z"){var ds=new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"));b=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(b))}
function theme(){document.documentElement.setAttribute("data-theme",S.theme);$("themes").innerHTML="";
  TH.forEach(function(t){var b=document.createElement("button");b.textContent=t[1];if(S.theme===t[0])b.className="on";b.onclick=function(){S.theme=t[0];theme()};$("themes").appendChild(b)})}
function render(){var el=$("pl");el.innerHTML="";
  if(!S.songs.length){el.innerHTML='<div class="empty">아직 비어있어요</div>';return}
  S.songs.forEach(function(s,i){var d=document.createElement("div");d.className="item"+(i===cur?" cur":"");
    d.innerHTML='<span class="n">'+(i+1)+'</span>';
    var inp=document.createElement("input");inp.value=s.note||"";inp.placeholder="이 곡 한마디";
    inp.onclick=function(e){e.stopPropagation()};inp.oninput=function(){s.note=inp.value};
    var a=document.createElement("a");a.className="go";a.textContent="↗";a.target="_blank";a.rel="noopener";a.href="https://www.youtube.com/watch?v="+s.id;a.onclick=function(e){e.stopPropagation()};
    var x=document.createElement("button");x.className="x";x.textContent="✕";
    x.onclick=function(e){e.stopPropagation();S.songs.splice(i,1);if(cur>=S.songs.length)cur=-1;render()};
    d.appendChild(inp);d.appendChild(a);d.appendChild(x);d.onclick=function(){play(i)};el.appendChild(d)})}
function play(i){cur=i;var id=S.songs[i].id;$("pcard").hidden=false;
  $("player").src="https://www.youtube.com/embed/"+id+"?autoplay=1&playsinline=1&rel=0";
  $("ext").href="https://www.youtube.com/watch?v="+id;render()}
function add(t){var id=vid(t);if(!id)return false;S.songs.push({id:id,note:""});render();play(S.songs.length-1);return true}
var dz=$("drop");
dz.addEventListener("dragover",function(e){e.preventDefault();dz.classList.add("hot")});
dz.addEventListener("dragleave",function(){dz.classList.remove("hot")});
dz.addEventListener("drop",function(e){e.preventDefault();dz.classList.remove("hot");add(e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain"))});
$("addBtn").onclick=function(){if(add($("url").value))$("url").value=""};
$("url").onkeydown=function(e){if(e.key==="Enter")$("addBtn").click()};
$("share").onclick=async function(){S.title=$("title").value;S.to=$("to").value;S.from=$("from").value;
  var u=location.origin+location.pathname+"?p="+await pack(S);
  $("out").value=u;$("out").select();try{await navigator.clipboard.writeText(u)}catch(e){}};
(async function(){
  var t=new URLSearchParams(location.search).get("p")||location.hash.slice(1);
  if(t){try{S=Object.assign(S,await unpack(t))}catch(e){fail=true}}
  if(fail){$("msg").hidden=false;$("msg").textContent="링크가 중간에 잘렸거나 깨졌어요. 보낸 사람에게 링크를 다시 받아 보세요."}
  $("title").value=S.title;$("to").value=S.to;$("from").value=S.from;theme();render();
})();
</script>
</body>
</html>
